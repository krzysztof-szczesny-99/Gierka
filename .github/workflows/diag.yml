name: Diagnostyka (jednorazowa)
on:
  push:
    branches: [e2e-results-diag-live]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Szczegóły ewolucji z PokéAPI
        run: |
          for id in 1 67 4; do
            echo "== evolution-chain/$id"
            curl -sS "https://pokeapi.co/api/v2/evolution-chain/$id/" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          def walk(l):
              for n in l["evolves_to"]:
                  for det in n["evolution_details"]:
                      setv={k:v for k,v in det.items() if v not in (None, False, "", [] , 0) or k=="min_level"}
                      print(l["species"]["name"], "->", n["species"]["name"], json.dumps(setv, ensure_ascii=False))
                  walk(n)
          walk(d["chain"])
          first=d["chain"]["evolves_to"][0]["evolution_details"][0]
          print("KLUCZE:", sorted(first.keys()))
          print("ZERA/INNE:", {k:v for k,v in first.items() if v == 0 or (isinstance(v,(int,float)) and not isinstance(v,bool))})
          '
          done
