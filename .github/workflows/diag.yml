name: Diagnostyka wdrożenia (jednorazowa)
on:
  push:
    branches: [e2e-results-diag-live]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nagłówki i wersja na żywej stronie
        run: |
          B=https://krzysztof-szczesny-99.github.io/Gierka
          for f in "" sw.js manifest.webmanifest; do echo "== $B/$f"; curl -sSI "$B/$f" | grep -iE "^(HTTP|cache-control|age|last-modified|etag|x-cache|x-served-by|date)"; done
          curl -sS "$B/" -o index.html
          echo "== skrypty w index.html"; grep -oE 'src="[^"]+\.js"' index.html
          main=$(grep -oE '/Gierka/assets/index-[^"]+\.js' index.html | head -1); echo "main=$main"
          curl -sS "https://krzysztof-szczesny-99.github.io$main" -o main.js
          echo "== wersja w bundlu"; grep -oE '835d0fa[0-9a-f]*|894c2b4[0-9a-f]*' main.js | sort | uniq -c
          grep -oE 'szepczacy-zagajnik' main.js | head -1 || true
          curl -sS "$B/sw.js" -o sw.js
          echo "== sw.js rozmiar: $(wc -c < sw.js)"
          echo "== wpisy precache i statusy"
          grep -oE 'url:"[^"]+"' sw.js | sed 's/url:"//;s/"$//' | while read u; do code=$(curl -s -o /dev/null -w '%{http_code}' "$B/$u"); echo "$code $u"; done
          grep -oE '"workbox-[a-z0-9]+\.js"|workbox-[a-z0-9]+' sw.js | sort -u | head
