# Buduje grę i publikuje ją na GitHub Pages przy każdym wypchnięciu na gałąź main.
# Jednorazowo: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Kontrola typów (informacyjnie, nie blokuje publikacji)
        run: npm run typecheck
        continue-on-error: true

      - name: Testy silnika gry
        run: npm test

      - name: Build (ścieżka bazowa repozytorium)
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
