# Buduje grę i publikuje ją na GitHub Pages przy każdym wypchnięciu na gałąź main.
# Publikacja następuje WYŁĄCZNIE po przejściu: kontroli typów, testów jednostkowych, buildu i testów E2E.
# Jednorazowo: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Czas buildu (widoczny w grze jako wersja)
        run: echo "VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Kontrola typów
        run: npm run typecheck

      - name: Testy jednostkowe
        run: npm test

      - name: Build do testów E2E
        run: npm run build

      - name: Przeglądarka do E2E
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Testy E2E (smoke + regresja)
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node e2e/smoke.mjs http://localhost:4173/
          node e2e/regression.mjs http://localhost:4173/

      - name: Build do publikacji (ścieżka bazowa repozytorium)
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
