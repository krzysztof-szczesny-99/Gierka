# Test dymny E2E: prawdziwy build + Phaser + PokéAPI w Chromium (ekran telefonu). Zrzuty ekranu w artefaktach.
name: Test E2E (telefon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Test dymny
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node e2e/smoke.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
      # Zrzuty także na osobnej gałęzi (jeden commit, nadpisywany) — łatwo je obejrzeć w przeglądarce.
      - name: Zrzuty na gałąź e2e-results
        if: always()
        run: |
          cd e2e-shots
          git init -q -b e2e-results
          git add -A
          git -c user.name="e2e-bot" -c user.email="e2e-bot@users.noreply.github.com" commit -q -m "Zrzuty E2E dla ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" e2e-results
